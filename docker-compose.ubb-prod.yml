services:
  db:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: ubbike_taller_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatorio}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_network
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: ubbike_taller_redis
    restart: unless-stopped
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs:
      - /data:uid=999,gid=1000,mode=700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubbike_taller_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      JWT_ISSUER: ${JWT_ISSUER:-ubbike-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ubbike-app}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-30}
      QR_DURATION_SECONDS: ${QR_DURATION_SECONDS:-15}
      REDIS_URL: redis://redis:6379
      REQUIRE_REDIS_RATE_LIMIT: "true"
      TRUST_PROXY: "1"
      FRONTEND_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL es obligatorio}
      CORS_ORIGINS: ${PUBLIC_API_BASE_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-UBBike <no-reply@ubbike.cl>}
      UPLOADS_DIR: /app/uploads
      UPLOADS_PUBLIC_PATH: /uploads
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - uploads_data:/app/uploads
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_network
      - frontend_network

  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL es obligatorio}
        CSP_CONNECT_SRC: "'self' ${PUBLIC_API_BASE_URL} ${PUBLIC_WS_BASE_URL:-}"
        CSP_IMG_SRC: "'self' data: blob: ${PUBLIC_API_BASE_URL}"
    container_name: ubbike_taller_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend_network

volumes:
  postgres_data:
    name: ubbike_taller_postgres_data
  uploads_data:
    name: ubbike_taller_uploads_data

networks:
  backend_network:
    name: ubbike_taller_backend_network
    driver: bridge
  frontend_network:
    name: ubbike_taller_frontend_network
    driver: bridge
