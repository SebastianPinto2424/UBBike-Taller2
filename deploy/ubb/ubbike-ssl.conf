<VirtualHost *:443>
    ServerName __PUBLIC_HOST__

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/ubbike.crt
    SSLCertificateKeyFile   /etc/ssl/private/ubbike.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "__HTTPS_PORT__"

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ProxyPass        /socket.io/  ws://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/  ws://127.0.0.1:3001/socket.io/

    ProxyPassMatch  "^/(autenticacion|auth|bicicletas|bicicleteros|historial|notificaciones|qr|accesos|guardias|solicitudes-guardia|incidencias|usuarios|uploads|salud|health|docs)(/.*)?$"  "http://127.0.0.1:3001/$1$2"

    ProxyPass        /  http://127.0.0.1:8082/
    ProxyPassReverse /  http://127.0.0.1:8082/

    ErrorLog  ${APACHE_LOG_DIR}/ubbike_error.log
    CustomLog ${APACHE_LOG_DIR}/ubbike_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName __PUBLIC_HOST__
    Redirect permanent / https://__PUBLIC_HOST__:__HTTPS_PORT__/
</VirtualHost>
