<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ubbike">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ubbike</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      var counter = 0;
      var selector = 'input, textarea';

      function clean(value) {
        return String(value || '')
          .toLowerCase()
          .replace(/[^a-z0-9_-]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function inferName(element) {
        var autocomplete = clean(element.getAttribute('autocomplete'));
        if (autocomplete && autocomplete !== 'off') {
          return 'ubbike-' + autocomplete;
        }

        var type = clean(element.getAttribute('type'));
        if (type) {
          return 'ubbike-' + type;
        }

        return 'ubbike-field';
      }

      function tagField(element) {
        if (!(element instanceof HTMLInputElement) &&
            !(element instanceof HTMLTextAreaElement)) {
          return;
        }

        if (!element.id) {
          counter += 1;
          element.id = 'ubbike-form-field-' + counter;
        }

        if (!element.name || element.dataset.ubbikeGeneratedName === 'true') {
          element.name = inferName(element);
          element.dataset.ubbikeGeneratedName = 'true';
        }
      }

      function tagFields(root) {
        if (!root) {
          return;
        }

        if (root.matches && root.matches(selector)) {
          tagField(root);
        }

        if (root.querySelectorAll) {
          root.querySelectorAll(selector).forEach(tagField);
        }
      }

      window.addEventListener('DOMContentLoaded', function () {
        tagFields(document);

        new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            if (mutation.type === 'attributes') {
              tagFields(mutation.target);
              return;
            }

            mutation.addedNodes.forEach(function (node) {
              if (node instanceof Element) {
                tagFields(node);
              }
            });
          });
        }).observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['autocomplete', 'type']
        });
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
